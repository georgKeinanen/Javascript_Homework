<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Javascript tulos 1.4</title>
</head>
<body>
<h1>Js tehtävä 1.4: <strong>Lajittelu hattu...</strong>
    Näyttää hieman Oogie boogielta elokuvasta Nightmare before Christmas</h1>
<p>I will cease to exist before you will even see me :P</p>
<img src="../OogieBoogie.png" width="465" height="331" alt="Kuva Oogie Boogiesta">
 <script>
     "use strict";
   let nimi=prompt('Anna nimi: ')
   let huonenro=Math.floor(Math.random()*4)+1
   if (huonenro===1)
    {document.querySelector('p').innerHTML =`${nimi}, Sinä kuulut nyt... Rohkelikkoon!`}

   else if (huonenro===2)
    {document.querySelector('p').innerHTML =`${nimi}, Sinä kuulut nyt... Luihuisiin!`}

   else if (huonenro===3)
    {document.querySelector('p').innerHTML =`${nimi}, Sinä kuulut nyt... Korpinkynteen`}

   else
    {document.querySelector('p').innerHTML =`${nimi}, Sinä kuulut nyt... Puuskupuhiin`}

 </script>
</body>
</html>
