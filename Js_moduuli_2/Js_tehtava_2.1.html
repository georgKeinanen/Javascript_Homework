<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lista kääntesessä järjestyksessä</title>
</head>
<body>
    <h1>JS tehtävä 2.1: Lista kääntesessä järjestyksessä</h1>
    <script>
        alert('anna 5 lukua')
        let luvut=[]
        for (let i=1; i < 6; i++)
            {let luku=parseInt(prompt('Anna ' +i+'. luku: '))
            luvut.push(luku)}
        for (let i=4; i>=0; i--)
            {console.log(luvut[i])}

    </script>
</body>
</html>
