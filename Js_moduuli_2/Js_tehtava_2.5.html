<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Javascript tulos 2.5</title>
</head>
<body>
    <h1>Js tehtävä 2.5: sama luku vain kerran</h1>
 <ul id='lista-luku'></ul>
  <script>
    'use strict';
    //Ohjelma vaati vain edellisen tehtävän kahden rivin muuttamista :P

    const lista_luku=document.querySelector('#lista-luku')
    let luvut=[]

    for(;;)
      {let luku=parseInt(prompt('Anna luku, toisen kerran syötetty sama luku lopettaa: '))
      if (luvut.includes(luku)===true)
      {break}
      luvut.push(luku)}

    luvut.sort((a,b) => a-b);
    console.log(luvut)

    for (let i of luvut)
    {lista_luku.innerHTML+='<li>'+i+'</li>';}
  </script>
</body>
</html>
